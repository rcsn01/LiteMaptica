[package]
name = "litemaptica"
version = "0.1.0"
description = "Evidence-backed Minecraft video reconstruction"
authors = ["LiteMaptica contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "litemaptica_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
